# Backstage app-config.yaml additions for backstage-claim-registry-plugin
#
# 1. Configure the proxy for the Machinery Registry API
# 2. Ensure GitHub integration is configured with a token

proxy:
  endpoints:
    '/machinery-registry':
      target: 'http://<machinery-registry-api-url>:8080'
      changeOrigin: true
      pathRewrite:
        '^/api/proxy/machinery-registry': ''
      allowedHeaders: ['*']
      credentials: 'dangerously-allow-unauthenticated'

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}
